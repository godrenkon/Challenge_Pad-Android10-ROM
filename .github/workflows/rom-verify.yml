name: Verify compiled Android 10 image contents

on:
  workflow_run:
    workflows: ['Compile Android 10 systemimage']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install read-only image inspection tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs android-sdk-libsparse-utils xz-utils
      - uses: actions/download-artifact@v4
        with:
          name: android10-systemimage-engineering-untested
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ctz-image
      - name: Verify compressed hash, unpack and check the built filesystem
        run: |
          cd "$RUNNER_TEMP/ctz-image"
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('.')
          name = 'suiram-ctz-android10-system.img.xz'
          lines = (root / 'SHA256SUMS').read_text().splitlines()
          if len(lines) != 1 or lines[0][64:] != '  ' + name:
              raise SystemExit('Unexpected checksum record')
          expected = lines[0][:64]
          digest = hashlib.sha256()
          with (root / name).open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          if digest.hexdigest() != expected:
              raise SystemExit('Compressed system image checksum mismatch')
          PY
          xz --decompress --keep suiram-ctz-android10-system.img.xz
          python3 "$GITHUB_WORKSPACE/scripts/verify-rom-content.py" suiram-ctz-android10-system.img --output "$RUNNER_TEMP/rom-content-verification.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android10-systemimage-content-verification
          path: ${{ runner.temp }}/rom-content-verification.json
          if-no-files-found: error
          retention-days: 30
