name: Verify compiled Android 10 image contents

on:
  workflow_run:
    workflows: ['Compile Android 10 systemimage']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install read-only image inspection tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs android-sdk-libsparse-utils xz-utils
      - uses: actions/download-artifact@v4
        with:
          name: android10-systemimage-engineering-untested
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ctz-image
      - uses: actions/download-artifact@v4
        with:
          name: android10-systemimage-build-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ctz-build-report
      - name: Bind the image to its receipt and verify content and measured capacity
        env:
          CTZ_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 scripts/verify-built-artifact.py \
            --image-dir "$RUNNER_TEMP/ctz-image" \
            --build-report-dir "$RUNNER_TEMP/ctz-build-report" \
            --work-dir "$RUNNER_TEMP/ctz-verified-image" \
            --output "$RUNNER_TEMP/rom-content-verification.json" \
            --partition-bytes 1413480448 \
            --build-run-id "$CTZ_BUILD_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android10-systemimage-content-verification
          path: ${{ runner.temp }}/rom-content-verification.json
          if-no-files-found: error
          retention-days: 30
