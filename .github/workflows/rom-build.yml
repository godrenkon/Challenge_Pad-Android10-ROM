name: Compile Android 10 systemimage

on:
  # A tracked request explicitly starts a reviewed recipe without requiring
  # another unrelated recipe edit. Ordinary source pushes do not start builds.
  push:
    paths:
      - '.github/rom-build-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctz-android10-systemimage
  # A new explicit build request replaces an obsolete recipe attempt.
  cancel-in-progress: true

jobs:
  systemimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      REPO_URL: https://github.com/aosp-mirror/tools_repo
      REPO_REV: 5998c0b50612af80c8a710b79692313e7f84c64a
      CTZ_COMPRESSED_STORAGE: 'true'
      CTZ_COMPILER_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim only preinstalled tools on this disposable runner
        run: |
          df -h
          free -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h
      - name: Install Android build host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison btrfs-progs btrfs-compsize build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
      - name: Restore compiler results with content-checked reuse
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ctz-compiler-cache
          key: ctz-compiler-v1-${{ runner.os }}-${{ hashFiles('manifest/ctz-android10.xml', 'config/source-profile.json', 'scripts/build-ctz.py', 'scripts/prepare-gsi-source.py', 'gsi/*.mk') }}
          restore-keys: |
            ctz-compiler-v1-${{ runner.os }}-
      - name: Set compiler cache capacity
        run: |
          mkdir -p "$RUNNER_TEMP/ctz-compiler-cache"
          CCACHE_DIR="$RUNNER_TEMP/ctz-compiler-cache" ccache --max-size=7G
      - name: Prepare compressed build storage and verify kernel compression
        run: python3 scripts/prepare-cloud-storage.py "$RUNNER_TEMP"
      - name: Install fixed upstream Repo launcher
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/aosp-mirror/tools_repo "$RUNNER_TEMP/ctz-repo-launcher"
          git -C "$RUNNER_TEMP/ctz-repo-launcher" checkout --detach "$REPO_REV"
          mkdir -p "$RUNNER_TEMP/ctz-bin"
          ln -s "$RUNNER_TEMP/ctz-repo-launcher/repo" "$RUNNER_TEMP/ctz-bin/repo"
          echo "$RUNNER_TEMP/ctz-bin" >> "$GITHUB_PATH"
      - name: Sync all fixed sources and compile the ROM system image
        timeout-minutes: 330
        run: python3 -u scripts/run-github-rom-build.py "$RUNNER_TEMP/ctz-rom-storage/ctz-rom"
      - name: Record compiler cache statistics
        if: always()
        run: |
          CCACHE_DIR="$RUNNER_TEMP/ctz-compiler-cache" ccache --cleanup
          CCACHE_DIR="$RUNNER_TEMP/ctz-compiler-cache" ccache --show-stats
      - name: Preserve compiler results even when the attempt times out
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ctz-compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Gather stage logs and build receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ctz-rom-report"
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          work = root / 'ctz-rom-storage/ctz-rom'
          report = root / 'ctz-rom-report'
          records = work / 'records'
          paths = [work / 'workflow-state.json', records / 'source-locked.xml']
          paths += list((records / 'logs').glob('*.log'))
          for attempt in records.glob('build-attempt-*'):
              paths += [attempt / 'build.log', attempt / 'build-receipt.json', attempt / 'source-locked.xml']
          for path in paths:
              if path.is_file() and not path.is_symlink():
                  destination = report / path.relative_to(work)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)
          storage = root / 'ctz-storage-report.json'
          if storage.is_file() and not storage.is_symlink():
              shutil.copyfile(storage, report / storage.name)
          PY
          df -h > "$RUNNER_TEMP/ctz-rom-report/final-disk.txt"
          if mountpoint -q "$RUNNER_TEMP/ctz-rom-storage"; then
            sudo btrfs filesystem usage -b "$RUNNER_TEMP/ctz-rom-storage" > "$RUNNER_TEMP/ctz-rom-report/storage-usage.txt"
            du -B1 "$RUNNER_TEMP/ctz-build-storage.btrfs" > "$RUNNER_TEMP/ctz-rom-report/backing-allocation.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android10-systemimage-build-report
          path: ${{ runner.temp }}/ctz-rom-report
          retention-days: 30
      - name: Compress produced system image
        if: success()
        run: |
          image=$(find "$RUNNER_TEMP/ctz-rom-storage/ctz-rom/records" -path '*/out/target/product/phhgsi_arm64_ab/system.img' -type f)
          test -n "$image"
          mkdir -p "$RUNNER_TEMP/ctz-systemimage"
          xz -T2 -c "$image" > "$RUNNER_TEMP/ctz-systemimage/suiram-ctz-android10-system.img.xz"
          cd "$RUNNER_TEMP/ctz-systemimage"
          sha256sum suiram-ctz-android10-system.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android10-systemimage-engineering-untested
          path: ${{ runner.temp }}/ctz-systemimage
          if-no-files-found: error
          retention-days: 30
