name: Validate source and preparation tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Existing extraction script syntax
        run: bash -n scripts/extract-stock.sh
      - name: Image, extraction and GSI source regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Required files, JSON and manifest
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          for name in ['README.md', 'docs/architecture.ja.md', 'docs/preparation.ja.md',
                       'docs/source-product.ja.md', 'gsi/suiram_ctz10.mk', 'gsi/ctz_locale.mk',
                       'scripts/prepare-gsi-source.py', 'config/source-profile.json',
                       'device/benesse/ctz/BoardConfig.mk', 'scripts/inspect-ctz.ps1']:
              assert pathlib.Path(name).is_file(), name
          for path in pathlib.Path('config').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          manifest = ET.parse('manifest/local_manifests/ctz.xml')
          assert manifest.find('project').get('path') == 'vendor/suiram/ctz-rom'
          assert '$(error ' in pathlib.Path('device/benesse/ctz/BoardConfig.mk').read_text()
          PY
      - name: Reject accidental binary blobs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.img', '.bin', '.so', '.apk', '.xz', '.zip'}
          files = [p for p in Path('.').rglob('*') if p.is_file()
                   and '.git' not in p.parts and p.suffix.lower() in forbidden]
          assert not files, f'Binary/proprietary files detected: {files}'
          PY
  powershell-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 offline tests
        shell: powershell
        run: ./tests/test-tools.ps1
  powershell-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7 offline tests
        shell: pwsh
        run: ./tests/test-tools.ps1
