name: Build Japanese IME for Android 10

on:
  push:
    paths:
      - '.github/workflows/japanese-ime.yml'
      - 'config/japanese-ime.json'
      - 'scripts/build-japanese-ime.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ime:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gorry/nicoWnnG
          ref: f0424c773941441124ca2707a5da7fb4816188df
          path: ime-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.1.13356709'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Japanese IME from reviewed source
        run: python3 scripts/build-japanese-ime.py ime-source --output "$RUNNER_TEMP/ctz-japanese-ime" --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctz-japanese-ime-unsigned
          path: ${{ runner.temp }}/ctz-japanese-ime
          if-no-files-found: warn
          retention-days: 30
